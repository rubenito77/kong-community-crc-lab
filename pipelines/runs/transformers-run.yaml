apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: kong-plugin-transformers-
  namespace: kong-demo
  labels:
    app.kubernetes.io/part-of: kong-community-crc-lab
    kong-lab/plugin: transformers
spec:
  pipelineRef:
    name: kong-plugin-transformers
  taskRunTemplate:
    serviceAccountName: kong-plugin-tester
  params:
    - name: git-url
      value: https://github.com/rubenito77/kong-community-crc-lab.git
    - name: git-revision
      value: main
    - name: kong-proxy-url
      value: http://kong-kong-proxy.kong.svc.cluster.local
    - name: cleanup
      value: "false"
  workspaces:
    - name: shared
      volumeClaimTemplate:
        metadata:
          labels:
            app.kubernetes.io/part-of: kong-community-crc-lab
            kong-lab/plugin: transformers
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 100Mi
