apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: kong-plugin-transformers
  namespace: kong-demo
  labels:
    app.kubernetes.io/part-of: kong-community-crc-lab
spec:
  description: >-
    Valida request-transformer y response-transformer de forma secuencial sobre
    /transform, manteniendo /demo y /demo2 como rutas de control.
  params:
    - name: git-url
      type: string
      default: https://github.com/rubenito77/kong-community-crc-lab.git
    - name: git-revision
      type: string
      default: main
    - name: kong-proxy-url
      type: string
      default: http://kong-kong-proxy.kong.svc.cluster.local
    - name: cleanup
      type: string
      default: "false"
  workspaces:
    - name: shared
  tasks:
    - name: clone-repository
      taskSpec:
        params:
          - name: git-url
            type: string
          - name: git-revision
            type: string
        workspaces:
          - name: source
        steps:
          - name: clone
            image: docker.io/alpine/git:v2.47.2
            env:
              - name: HOME
                value: /tekton/home
              - name: GIT_URL
                value: $(params.git-url)
              - name: GIT_REVISION
                value: $(params.git-revision)
            script: |
              #!/bin/sh
              set -eu
              git config --global --add safe.directory "$(workspaces.source.path)"
              rm -rf "$(workspaces.source.path)"/*
              git clone --depth 1 --branch "${GIT_REVISION}" "${GIT_URL}" "$(workspaces.source.path)"
              git -C "$(workspaces.source.path)" rev-parse HEAD
      params:
        - name: git-url
          value: $(params.git-url)
        - name: git-revision
          value: $(params.git-revision)
      workspaces:
        - name: source
          workspace: shared

    - name: validate-baseline
      runAfter:
        - clone-repository
      taskSpec:
        params:
          - name: kong-proxy-url
            type: string
        steps:
          - name: test-baseline
            image: docker.io/curlimages/curl:8.12.1
            env:
              - name: HOME
                value: /tekton/home
              - name: KONG_PROXY_URL
                value: $(params.kong-proxy-url)
            script: |
              #!/bin/sh
              set -eu
              code="$(curl -sS -D /tmp/headers -o /tmp/body -w '%{http_code}' \
                "${KONG_PROXY_URL}/transform")"
              echo "baseline /transform: HTTP ${code}"
              test "${code}" = "200"
              ! grep -qi 'x-lab-request-transform' /tmp/body
              ! grep -qi '^X-Lab-Response-Transform:' /tmp/headers
      params:
        - name: kong-proxy-url
          value: $(params.kong-proxy-url)

    - name: apply-request-transformer
      runAfter:
        - validate-baseline
      taskSpec:
        workspaces:
          - name: source
        steps:
          - name: apply
            image: quay.io/openshift/origin-cli:4.22
            env:
              - name: HOME
                value: /tekton/home
            script: |
              #!/bin/sh
              set -eu
              oc apply -f "$(workspaces.source.path)/manifests/plugins/transformers/request-transformer.yaml"
              oc annotate ingress kong-transform-echo -n kong-demo \
                konghq.com/plugins=demo-request-transformer --overwrite
              sleep 10
      workspaces:
        - name: source
          workspace: shared

    - name: test-request-transformer
      runAfter:
        - apply-request-transformer
      taskSpec:
        params:
          - name: kong-proxy-url
            type: string
        workspaces:
          - name: evidence
        steps:
          - name: execute
            image: docker.io/curlimages/curl:8.12.1
            env:
              - name: HOME
                value: /tekton/home
              - name: KONG_PROXY_URL
                value: $(params.kong-proxy-url)
            script: |
              #!/bin/sh
              set -eu
              evidence="$(workspaces.evidence.path)/transformers-results.txt"
              : > "${evidence}"
              code="$(curl -sS -D /tmp/request.headers -o /tmp/request.body \
                -w '%{http_code}' "${KONG_PROXY_URL}/transform")"
              echo "request-transformer status=${code}" | tee -a "${evidence}"
              test "${code}" = "200"
              grep -qi 'x-lab-request-transform' /tmp/request.body
              grep -q 'added-by-kong' /tmp/request.body
              ! grep -qi '^X-Lab-Response-Transform:' /tmp/request.headers
              echo "PASS request-transformer: upstream recibio X-Lab-Request-Transform" \
                | tee -a "${evidence}"
      params:
        - name: kong-proxy-url
          value: $(params.kong-proxy-url)
      workspaces:
        - name: evidence
          workspace: shared

    - name: apply-response-transformer
      runAfter:
        - test-request-transformer
      taskSpec:
        workspaces:
          - name: source
        steps:
          - name: apply
            image: quay.io/openshift/origin-cli:4.22
            env:
              - name: HOME
                value: /tekton/home
            script: |
              #!/bin/sh
              set -eu
              oc apply -f "$(workspaces.source.path)/manifests/plugins/transformers/response-transformer.yaml"
              oc annotate ingress kong-transform-echo -n kong-demo \
                konghq.com/plugins=demo-request-transformer,demo-response-transformer --overwrite
              sleep 10
      workspaces:
        - name: source
          workspace: shared

    - name: test-response-transformer
      runAfter:
        - apply-response-transformer
      taskSpec:
        params:
          - name: kong-proxy-url
            type: string
        workspaces:
          - name: evidence
        steps:
          - name: execute
            image: docker.io/curlimages/curl:8.12.1
            env:
              - name: HOME
                value: /tekton/home
              - name: KONG_PROXY_URL
                value: $(params.kong-proxy-url)
            script: |
              #!/bin/sh
              set -eu
              evidence="$(workspaces.evidence.path)/transformers-results.txt"
              code="$(curl -sS -D /tmp/response.headers -o /tmp/response.body \
                -w '%{http_code}' "${KONG_PROXY_URL}/transform")"
              echo "response-transformer status=${code}" | tee -a "${evidence}"
              test "${code}" = "200"
              grep -qi 'x-lab-request-transform' /tmp/response.body
              grep -qi '^X-Lab-Response-Transform: added-by-kong' /tmp/response.headers

              for path in demo demo2; do
                control="$(curl -sS -D "/tmp/${path}.headers" -o /dev/null \
                  -w '%{http_code}' "${KONG_PROXY_URL}/${path}")"
                echo "control=/${path} status=${control}" | tee -a "${evidence}"
                test "${control}" = "200"
                ! grep -qi '^X-Lab-Response-Transform:' "/tmp/${path}.headers"
              done
              echo "PASS response-transformer: header agregado y rutas de control aisladas" \
                | tee -a "${evidence}"
      params:
        - name: kong-proxy-url
          value: $(params.kong-proxy-url)
      workspaces:
        - name: evidence
          workspace: shared
  finally:
    - name: cleanup
      when:
        - input: $(params.cleanup)
          operator: in
          values:
            - "true"
      taskSpec:
        steps:
          - name: remove-plugins
            image: quay.io/openshift/origin-cli:4.22
            env:
              - name: HOME
                value: /tekton/home
            script: |
              #!/bin/sh
              set -eu
              oc annotate ingress kong-transform-echo -n kong-demo konghq.com/plugins- || true
              oc delete kongplugin demo-request-transformer demo-response-transformer \
                -n kong-demo --ignore-not-found
