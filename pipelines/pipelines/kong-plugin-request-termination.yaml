apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: kong-plugin-request-termination
  namespace: kong-demo
  labels:
    app.kubernetes.io/part-of: kong-community-crc-lab
spec:
  description: >-
    Valida request-termination con HTTP 503 sobre /transform y mantiene /demo
    y /demo2 como rutas de control.
  params:
    - name: git-url
      type: string
      default: https://github.com/rubenito77/kong-community-crc-lab.git
    - name: git-revision
      type: string
      default: main
    - name: kong-proxy-url
      type: string
      default: http://kong-kong-proxy.kong.svc.cluster.local
    - name: cleanup
      type: string
      default: "false"
  workspaces:
    - name: shared
  tasks:
    - name: clone-repository
      taskSpec:
        params:
          - name: git-url
            type: string
          - name: git-revision
            type: string
        workspaces:
          - name: source
        steps:
          - name: clone
            image: docker.io/alpine/git:v2.47.2
            env:
              - name: HOME
                value: /tekton/home
              - name: GIT_URL
                value: $(params.git-url)
              - name: GIT_REVISION
                value: $(params.git-revision)
            script: |
              #!/bin/sh
              set -eu
              git config --global --add safe.directory "$(workspaces.source.path)"
              rm -rf "$(workspaces.source.path)"/*
              git clone --depth 1 --branch "${GIT_REVISION}" "${GIT_URL}" "$(workspaces.source.path)"
              git -C "$(workspaces.source.path)" rev-parse HEAD
      params:
        - name: git-url
          value: $(params.git-url)
        - name: git-revision
          value: $(params.git-revision)
      workspaces:
        - name: source
          workspace: shared

    - name: validate-baseline
      runAfter:
        - clone-repository
      taskSpec:
        params:
          - name: kong-proxy-url
            type: string
        steps:
          - name: test-route
            image: docker.io/curlimages/curl:8.12.1
            env:
              - name: HOME
                value: /tekton/home
              - name: KONG_PROXY_URL
                value: $(params.kong-proxy-url)
            script: |
              #!/bin/sh
              set -eu
              code="$(curl -sS -D /tmp/baseline.headers -o /tmp/baseline.body \
                -w '%{http_code}' "${KONG_PROXY_URL}/transform")"
              echo "baseline /transform: HTTP ${code}"
              test "${code}" = "200"
              grep -q '"path"' /tmp/baseline.body
              grep -qi '^x-kong-upstream-latency:' /tmp/baseline.headers
      params:
        - name: kong-proxy-url
          value: $(params.kong-proxy-url)

    - name: apply-plugin
      runAfter:
        - validate-baseline
      taskSpec:
        workspaces:
          - name: source
        steps:
          - name: apply
            image: quay.io/openshift/origin-cli:4.22
            env:
              - name: HOME
                value: /tekton/home
            script: |
              #!/bin/sh
              set -eu
              oc apply -f "$(workspaces.source.path)/manifests/plugins/request-termination/kongplugin.yaml"
              oc annotate ingress kong-transform-echo -n kong-demo \
                konghq.com/plugins=demo-request-termination --overwrite
              sleep 10
      workspaces:
        - name: source
          workspace: shared

    - name: test-termination
      runAfter:
        - apply-plugin
      taskSpec:
        params:
          - name: kong-proxy-url
            type: string
        workspaces:
          - name: evidence
        steps:
          - name: execute
            image: docker.io/curlimages/curl:8.12.1
            env:
              - name: HOME
                value: /tekton/home
              - name: KONG_PROXY_URL
                value: $(params.kong-proxy-url)
            script: |
              #!/bin/sh
              set -eu
              evidence="$(workspaces.evidence.path)/request-termination-results.txt"
              : > "${evidence}"

              terminated="$(curl -sS -D /tmp/terminated.headers -o /tmp/terminated.body \
                -w '%{http_code}' "${KONG_PROXY_URL}/transform")"
              echo "terminated /transform status=${terminated}" | tee -a "${evidence}"
              test "${terminated}" = "503"
              grep -q 'Ruta temporalmente deshabilitada por Kong Community' /tmp/terminated.body
              grep -qi '^server: kong/' /tmp/terminated.headers
              ! grep -q '"path"' /tmp/terminated.body
              ! grep -qi '^x-kong-upstream-latency:' /tmp/terminated.headers

              for path in demo demo2; do
                control="$(curl -sS -o /dev/null -w '%{http_code}' \
                  "${KONG_PROXY_URL}/${path}")"
                echo "control=/${path} status=${control}" | tee -a "${evidence}"
                test "${control}" = "200"
              done
              echo 'PASS: /transform terminado por Kong y rutas de control aisladas' \
                | tee -a "${evidence}"
      params:
        - name: kong-proxy-url
          value: $(params.kong-proxy-url)
      workspaces:
        - name: evidence
          workspace: shared
  finally:
    - name: cleanup
      when:
        - input: $(params.cleanup)
          operator: in
          values:
            - "true"
      taskSpec:
        steps:
          - name: remove-plugin
            image: quay.io/openshift/origin-cli:4.22
            env:
              - name: HOME
                value: /tekton/home
            script: |
              #!/bin/sh
              set -eu
              oc annotate ingress kong-transform-echo -n kong-demo konghq.com/plugins- || true
              oc delete kongplugin demo-request-termination -n kong-demo --ignore-not-found
