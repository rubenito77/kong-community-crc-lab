apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: kong-plugin-request-size-limiting
  namespace: kong-demo
  labels:
    app.kubernetes.io/part-of: kong-community-crc-lab
spec:
  description: >-
    Valida request-size-limiting sobre /transform con un payload permitido y
    otro superior a 1 KiB, manteniendo /demo y /demo2 como controles.
  params:
    - name: git-url
      type: string
      default: https://github.com/rubenito77/kong-community-crc-lab.git
    - name: git-revision
      type: string
      default: main
    - name: kong-proxy-url
      type: string
      default: http://kong-kong-proxy.kong.svc.cluster.local
    - name: cleanup
      type: string
      default: "false"
  workspaces:
    - name: shared
  tasks:
    - name: clone-repository
      taskSpec:
        params:
          - name: git-url
            type: string
          - name: git-revision
            type: string
        workspaces:
          - name: source
        steps:
          - name: clone
            image: docker.io/alpine/git:v2.47.2
            env:
              - name: HOME
                value: /tekton/home
              - name: GIT_URL
                value: $(params.git-url)
              - name: GIT_REVISION
                value: $(params.git-revision)
            script: |
              #!/bin/sh
              set -eu
              git config --global --add safe.directory "$(workspaces.source.path)"
              rm -rf "$(workspaces.source.path)"/*
              git clone --depth 1 --branch "${GIT_REVISION}" "${GIT_URL}" "$(workspaces.source.path)"
              git -C "$(workspaces.source.path)" rev-parse HEAD
      params:
        - name: git-url
          value: $(params.git-url)
        - name: git-revision
          value: $(params.git-revision)
      workspaces:
        - name: source
          workspace: shared

    - name: validate-baseline
      runAfter:
        - clone-repository
      taskSpec:
        params:
          - name: kong-proxy-url
            type: string
        steps:
          - name: test-route
            image: docker.io/curlimages/curl:8.12.1
            env:
              - name: HOME
                value: /tekton/home
              - name: KONG_PROXY_URL
                value: $(params.kong-proxy-url)
            script: |
              #!/bin/sh
              set -eu
              printf '%02048d' 0 > /tmp/baseline.payload
              code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
                -H 'Content-Type: text/plain' --data-binary @/tmp/baseline.payload \
                "${KONG_PROXY_URL}/transform")"
              echo "baseline 2048 bytes: HTTP ${code}"
              test "${code}" = "200"
      params:
        - name: kong-proxy-url
          value: $(params.kong-proxy-url)

    - name: apply-plugin
      runAfter:
        - validate-baseline
      taskSpec:
        workspaces:
          - name: source
        steps:
          - name: apply
            image: quay.io/openshift/origin-cli:4.22
            env:
              - name: HOME
                value: /tekton/home
            script: |
              #!/bin/sh
              set -eu
              oc apply -f "$(workspaces.source.path)/manifests/plugins/request-size-limiting/kongplugin.yaml"
              oc annotate ingress kong-transform-echo -n kong-demo \
                konghq.com/plugins=demo-request-size-limit --overwrite
              sleep 10
      workspaces:
        - name: source
          workspace: shared

    - name: test-request-size
      runAfter:
        - apply-plugin
      taskSpec:
        params:
          - name: kong-proxy-url
            type: string
        workspaces:
          - name: evidence
        steps:
          - name: execute
            image: docker.io/curlimages/curl:8.12.1
            env:
              - name: HOME
                value: /tekton/home
              - name: KONG_PROXY_URL
                value: $(params.kong-proxy-url)
            script: |
              #!/bin/sh
              set -eu
              evidence="$(workspaces.evidence.path)/request-size-limiting-results.txt"
              : > "${evidence}"
              printf '%0512d' 0 > /tmp/allowed.payload
              printf '%02048d' 0 > /tmp/rejected.payload

              allowed="$(curl -sS -o /tmp/allowed.body -w '%{http_code}' -X POST \
                -H 'Content-Type: text/plain' --data-binary @/tmp/allowed.payload \
                "${KONG_PROXY_URL}/transform")"
              echo "allowed bytes=512 status=${allowed}" | tee -a "${evidence}"
              test "${allowed}" = "200"

              rejected="$(curl -sS -o /tmp/rejected.body -w '%{http_code}' -X POST \
                -H 'Content-Type: text/plain' --data-binary @/tmp/rejected.payload \
                "${KONG_PROXY_URL}/transform")"
              echo "rejected bytes=2048 status=${rejected}" | tee -a "${evidence}"
              test "${rejected}" = "413"
              grep -qi 'request size' /tmp/rejected.body

              for path in demo demo2; do
                control="$(curl -sS -o /dev/null -w '%{http_code}' \
                  "${KONG_PROXY_URL}/${path}")"
                echo "control=/${path} status=${control}" | tee -a "${evidence}"
                test "${control}" = "200"
              done
              echo 'PASS: 512 bytes permitidos, 2048 bytes rechazados y controles aislados' \
                | tee -a "${evidence}"
      params:
        - name: kong-proxy-url
          value: $(params.kong-proxy-url)
      workspaces:
        - name: evidence
          workspace: shared
  finally:
    - name: cleanup
      when:
        - input: $(params.cleanup)
          operator: in
          values:
            - "true"
      taskSpec:
        steps:
          - name: remove-plugin
            image: quay.io/openshift/origin-cli:4.22
            env:
              - name: HOME
                value: /tekton/home
            script: |
              #!/bin/sh
              set -eu
              oc annotate ingress kong-transform-echo -n kong-demo konghq.com/plugins- || true
              oc delete kongplugin demo-request-size-limit -n kong-demo --ignore-not-found
