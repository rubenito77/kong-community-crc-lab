apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kong-demo
resources:
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: otel-lab-config
    files:
      - collector.yaml
      - evidence.py
generatorOptions:
  disableNameSuffixHash: true
  labels:
    kong-lab/plugin: opentelemetry
