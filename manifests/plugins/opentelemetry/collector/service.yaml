apiVersion: v1
kind: Service
metadata:
  name: otel-lab-collector
  namespace: kong-demo
  labels:
    kong-lab/plugin: opentelemetry
spec:
  type: ClusterIP
  selector:
    app: otel-lab-collector
  ports:
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: evidence
      port: 8080
      targetPort: evidence
