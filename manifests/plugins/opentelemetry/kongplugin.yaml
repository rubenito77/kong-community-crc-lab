apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: demo-opentelemetry
  namespace: kong-demo
  labels:
    kong-lab/plugin: opentelemetry
plugin: opentelemetry
config:
  traces_endpoint: http://otel-lab-collector.kong-demo.svc.cluster.local:4318/v1/traces
  resource_attributes:
    service.name: kong-otel-lab
  sampling_rate: 1.0
  propagation:
    extract: [w3c]
    inject: [w3c]
    default_format: w3c
  queue:
    max_batch_size: 20
    max_coalescing_delay: 1
    max_retry_time: 15
  connect_timeout: 1000
  send_timeout: 3000
  read_timeout: 3000
