apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-log-receiver
  namespace: kong-demo
  labels:
    kong-lab/plugin: http-log
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: http-log-receiver
  template:
    metadata:
      labels:
        app: http-log-receiver
        kong-lab/plugin: http-log
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: receiver
          image: docker.io/python:3.13-alpine
          command: [python, -B, /app/receiver.py]
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: http-log-receiver-code
