apiVersion: v1
kind: Service
metadata:
  name: kong-lab-prometheus-metrics
  namespace: kong
  labels:
    app.kubernetes.io/part-of: kong-community-crc-lab
    kong-lab/plugin: prometheus
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: kong
    app.kubernetes.io/name: kong
    app.kubernetes.io/component: app
  ports:
  - name: gateway-metrics
    port: 8100
    targetPort: 8100
    protocol: TCP
